appId: org.queenzone.mobile
---
- tapOn:
    id: tab-archive
- extendedWaitUntil:
    visible:
      id: archive-hub-screen
    timeout: 15000
- tapOn:
    id: tab-home
- tapOn:
    id: home-search
- extendedWaitUntil:
    visible:
      id: search-screen
    timeout: 15000
- tapOn:
    id: search-input
- inputText: modernisation
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: search-result-news-1003
    timeout: 20000
- tapOn:
    id: search-result-news-1003
- extendedWaitUntil:
    visible:
      id: news-story-screen
    timeout: 20000
# Story hides the tab bar. Leave through its header before 07-forum tries to
# switch tabs, matching the other story flows fixed by #1374.
- tapOn:
    id: news-story-back
- extendedWaitUntil:
    visible:
      id: search-screen
    timeout: 15000
