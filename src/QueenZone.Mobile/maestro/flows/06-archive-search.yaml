appId: org.queenzone.mobile
---
- tapOn:
    id: tab-archive
- extendedWaitUntil:
    visible:
      id: archive-hub-screen
    timeout: 15000
- tapOn:
    id: tab-home
- tapOn:
    id: home-search
- extendedWaitUntil:
    visible:
      id: search-screen
    timeout: 15000
- tapOn:
    id: search-input
- inputText: Live Aid
- hideKeyboard
- tapOn:
    id: search-result-live-aid-wembley-stadium-14-photographs
- extendedWaitUntil:
    visible:
      id: photos-screen
    timeout: 20000
