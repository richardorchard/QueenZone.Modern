appId: org.queenzone.mobile
---
# Debug smoke binaries embed JS and skip the expo-dev-client launcher (#1225).
# After launch the QueenZone home testID must be visible on the Testing host.
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: home-hero
    timeout: 30000
