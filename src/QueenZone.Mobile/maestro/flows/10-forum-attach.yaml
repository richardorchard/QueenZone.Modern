appId: org.queenzone.mobile
---
# Journeys is a cold simctl install with no 01-launch. launchApp first so
# openLink is not the SpringBoard "Open in QueenZone?" prompt (#1247).
# Wait for home-screen before the deep link: SessionProvider mounts only
# after BootSplash leaves booting, and iOS still shows the Open confirm
# on a fresh install (#1281). Files first, then Debug inject (#1072).
- launchApp:
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 45000
- runFlow: open-smoke-auth.yaml
- extendedWaitUntil:
    visible:
      id: tab-forum
    timeout: 45000
- tapOn:
    id: tab-forum
- extendedWaitUntil:
    visible:
      id: forum-screen
    timeout: 20000
- tapOn:
    id: forum-board-1
- extendedWaitUntil:
    visible:
      id: forum-category-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: forum-thread-${ATTACH_TOPIC_ID}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: forum-thread-${ATTACH_TOPIC_ID}
- extendedWaitUntil:
    visible:
      id: forum-thread-screen
    timeout: 20000
- assertVisible: Journey attach topic
- tapOn:
    id: forum-thread-reply
- extendedWaitUntil:
    visible:
      id: forum-composer-attach-files
    timeout: 20000
- tapOn:
    id: forum-composer-body
- inputText: Journey attach reply
- hideKeyboard
- tapOn:
    id: forum-composer-attach-files
- extendedWaitUntil:
    visible:
      id: forum-composer-attach-inject
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: forum-composer-attach-inject
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink: ${SMOKE_ATTACH_URL}
      - runFlow: accept-ios-open-link.yaml
- extendedWaitUntil:
    visible:
      id: forum-composer-attachment
    timeout: 15000
- tapOn:
    id: forum-composer-submit
- extendedWaitUntil:
    visible:
      id: forum-thread-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: forum-thread-attachment
    direction: DOWN
    timeout: 20000
- tapOn:
    id: forum-thread-attachment
- extendedWaitUntil:
    visible:
      id: forum-thread-attachment-opened
    timeout: 20000
# Thread screens hide the tab bar. Return to the Forum root so the next
# journey can switch tabs without depending on preserved nested state.
- tapOn:
    id: forum-thread-back
- extendedWaitUntil:
    visible:
      id: forum-category-screen
    timeout: 15000
- tapOn:
    id: tab-forum
- extendedWaitUntil:
    visible:
      id: forum-screen
    timeout: 15000
