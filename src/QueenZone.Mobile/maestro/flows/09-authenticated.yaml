appId: org.queenzone.mobile
---
# Testing-seeded access token from the contract-host fixture. The runner
# exports SMOKE_AUTH_URL. Debug or Release-embedded smoke builds handle
# queenzone://smoke-auth when appEnv is development.
- runFlow: open-smoke-auth.yaml
- tapOn:
    id: tab-home
- tapOn:
    id: home-profile
- runFlow:
    when:
      visible:
        id: profile-signed-out
    commands:
      # iOS can accept the system Open prompt without delivering the first
      # foreground URL event. Retry only that confirmed transport miss.
      - runFlow: open-smoke-auth.yaml
- extendedWaitUntil:
    visible:
      id: profile-signed-in
    timeout: 20000
- assertVisible:
    id: profile-display-name
- assertVisible: Contract Member
- tapOn:
    id: profile-messages
- extendedWaitUntil:
    visible:
      id: inbox-screen
    timeout: 20000
- assertNotVisible:
    id: member-gate
- assertVisible: Contract Other
