appId: org.queenzone.mobile
---
- tapOn:
    id: tab-news
- extendedWaitUntil:
    visible:
      id: news-screen
    timeout: 20000
- tapOn:
    id: news-story-1003
- extendedWaitUntil:
    visible:
      id: news-story-screen
    timeout: 20000
- assertVisible: QueenZone modernisation begins
# Story hides the tab bar (navigation/visibility.ts) — leave via its own
# back control, same pattern as 08-profile-signed-out.yaml's profile-back.
- tapOn:
    id: news-story-back
- extendedWaitUntil:
    visible:
      id: news-screen
    timeout: 15000
