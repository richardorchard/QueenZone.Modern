appId: org.queenzone.mobile
---
# Forum tab-root identity header (not the Home masthead). Badge is GET /api/v1/me/messages/unread-count only (#1074).
- openLink: ${SMOKE_AUTH_URL}
- tapOn:
    id: tab-forum
- extendedWaitUntil:
    visible:
      id: forum-screen
    timeout: 20000
- assertNotVisible:
    id: tab-masthead
- extendedWaitUntil:
    visible:
      id: home-messages
    timeout: 20000
- extendedWaitUntil:
    visible: Messages, 1 unread conversations
    timeout: 20000
- tapOn:
    id: home-messages
- extendedWaitUntil:
    visible:
      id: inbox-screen
    timeout: 20000
- assertNotVisible:
    id: member-gate
- assertVisible: Contract Other
