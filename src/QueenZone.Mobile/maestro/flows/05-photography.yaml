appId: org.queenzone.mobile
---
- tapOn:
    id: tab-photos
- extendedWaitUntil:
    visible:
      id: photos-screen
    timeout: 20000
- tapOn:
    id: photo-category-brian-may
- extendedWaitUntil:
    visible:
      id: photo-category-screen
    timeout: 20000
- tapOn:
    id: photo-item-101
- extendedWaitUntil:
    visible:
      id: photo-viewer-screen
    timeout: 20000
# PhotoViewer hides the tab bar (navigation/visibility.ts) — leave via its
# own close control, same pattern as 08-profile-signed-out.yaml's profile-back.
# Close pops back to the category, not the tab root.
- tapOn:
    id: photo-viewer-close
- extendedWaitUntil:
    visible:
      id: photo-category-screen
    timeout: 15000
