appId: org.queenzone.mobile
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Timeline
    commands:
      - back
- runFlow:
    when:
      visible: CHAPTER 1
    commands:
      - back
- tapOn:
    id: tab-archive
- extendedWaitUntil:
    visible:
      id: archive-hub-screen
    timeout: 20000
- tapOn: ".*Biography.*"
- extendedWaitUntil:
    visible: Biography
    timeout: 30000
- takeScreenshot: 10-biography
