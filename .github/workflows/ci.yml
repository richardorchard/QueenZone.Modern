name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
      migrations: ${{ steps.check.outputs.migrations }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for code changes
        id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> $GITHUB_OUTPUT
            echo "migrations=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only origin/main...HEAD | grep -qvE '^(docs/|[^/]*\.md$)'; then
            echo "code=true" >> $GITHUB_OUTPUT
          else
            echo "code=false" >> $GITHUB_OUTPUT
            echo "Docs-only PR — skipping build and test jobs."
          fi

          if git diff --name-only origin/main...HEAD | grep -qE \
            '^(src/QueenZone\.Data/Migrations/|src/QueenZone\.Data/QueenZoneDbContext\.cs|src/QueenZone\.Data/QueenZoneDbContextFactory\.cs|src/QueenZone\.Data/Entities/)'; then
            echo "migrations=true" >> $GITHUB_OUTPUT
            echo "EF migration-related paths changed — will run Azure SQL migration gate."
          else
            echo "migrations=false" >> $GITHUB_OUTPUT
          fi

  # Builds and publishes the Linux app once per PR run ("build once, test many").
  # Deterministic tests run in the `test` matrix (mixed Web.Tests shards — see
  # docs/architecture/testing-policy.md). smoke-test reuses the publish
  # artifact. e2e-test still builds on Windows but skips the solution unit graph.
  # deploy.yml rebuilds separately after merge — see that file for why.
  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore QueenZone.sln

      - name: Build
        run: dotnet build QueenZone.sln --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format QueenZone.sln --verify-no-changes --no-restore

      # Sharded test jobs download these outputs and run `dotnet test --no-build`
      # so we do not pay a second full compile on each matrix leg.
      # Include obj/Release: WebApplicationFactory hosts need build intermediates
      # such as src/QueenZone.Web/obj/.../compressed/ for static web assets.
      - name: Upload build binaries
        uses: actions/upload-artifact@v5
        with:
          name: build-binaries-${{ github.run_id }}
          path: |
            src/**/bin/Release/
            src/**/obj/Release/
            tests/**/bin/Release/
            tests/**/obj/Release/
          retention-days: 1
          if-no-files-found: error

      # Single Linux publish reused by smoke-test in this run.
      - name: Publish web app
        run: dotnet publish src/QueenZone.Web/QueenZone.Web.csproj --configuration Release --no-build --output publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-publish-${{ github.run_id }}
          path: publish
          retention-days: 7

  # Mixed Web.Tests shards (unit + WAF in every shard). Do not change this to a
  # unit-vs-integration split — that regresses wall-clock (issue #442).
  test:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Download build binaries
        uses: actions/download-artifact@v5
        with:
          name: build-binaries-${{ github.run_id }}
          path: .

      - name: Restore (NuGet cache for test host deps)
        run: dotnet restore QueenZone.sln

      - name: Show shard assignment
        shell: pwsh
        run: ./scripts/Get-WebTestShardFilter.ps1 -ShardIndex ${{ matrix.shard }} -ShardCount 2 -List

      - name: Test shard ${{ matrix.shard }} with coverage
        shell: pwsh
        run: |
          $includeSmall = $${{ matrix.shard == 0 }}
          ./scripts/Invoke-WebTestsShard.ps1 `
            -ShardIndex ${{ matrix.shard }} `
            -ShardCount 2 `
            -CollectCoverage `
            -IncludeSmallProjects:$includeSmall `
            -ResultsDirectory ./TestResults `
            -NoBuild `
            -NoRestore

      - name: Upload coverage results
        uses: actions/upload-artifact@v5
        with:
          name: coverage-raw-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: TestResults
          retention-days: 2
          if-no-files-found: error

  # Runs the modern-schema query paths that only SQL Server can execute (EF Core's SQLite
  # provider used by the `test` job above cannot translate DateTimeOffset comparisons at all).
  # See tests/QueenZone.SqlServerTests and docs/architecture/testing-policy.md
  # ("Modern-schema SQL Server tests"). This is a throwaway container scoped to CI, not the
  # shared Azure SQL used by `ef-migrations`/deploy.yml.
  sql-server-tests:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiOnly!Sql_2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly!Sql_2026 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore QueenZone.sln

      - name: Run SQL Server-only tests with coverage
        shell: pwsh
        env:
          ConnectionStrings__SqlServerTest: "Server=localhost,1433;User Id=sa;Password=CiOnly!Sql_2026;TrustServerCertificate=True"
        run: |
          dotnet test tests/QueenZone.SqlServerTests/QueenZone.SqlServerTests.csproj `
            --configuration Release `
            --collect:"XPlat Code Coverage" `
            --settings coverlet.runsettings `
            --results-directory ./TestResults

      - name: Upload coverage results
        uses: actions/upload-artifact@v5
        with:
          name: coverage-raw-${{ github.run_id }}-shard-sqlserver
          path: TestResults
          retention-days: 2
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: [changes, test, sql-server-tests]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage results
        uses: actions/download-artifact@v5
        with:
          pattern: coverage-raw-${{ github.run_id }}-shard-*
          path: TestResults
          merge-multiple: true

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub

      - name: Add coverage summary
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Enforce coverage gate
        shell: pwsh
        run: ./scripts/Test-CoverageGate.ps1 -Reports ./TestResults -GlobalLineThreshold 51 -ChangedLineThreshold 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage-report
          retention-days: 14

  ef-migrations:
    name: EF migrations (Azure SQL)
    runs-on: ubuntu-latest
    needs: changes
    # Same-repo PRs only: applies pending migrations to the shared Azure SQL used by deploy.
    # Skipped on fork PRs (no secret). deploy.yml's migrate job runs the same
    # `database update` again after merge, against the same database.
    if: |
      needs.changes.outputs.migrations == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: dev
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore tools and solution
        run: |
          dotnet tool restore
          dotnet restore QueenZone.sln

      - name: Check EF model snapshot is current
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/QueenZone.Data/QueenZone.Data.csproj \
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Apply migrations to Azure SQL
        env:
          ConnectionStrings__QueenZoneLegacy: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: |
          if [ -z "$ConnectionStrings__QueenZoneLegacy" ]; then
            echo "::error::QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping before merging EF migration PRs."
            exit 1
          fi

          echo "Applying EF migrations against Azure SQL (same target as App Service deploy)."
          echo "This catches SQL Server batch-binding errors, bad procs, and long-running DDL before merge."
          dotnet ef database update \
            --project src/QueenZone.Data/QueenZone.Data.csproj \
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

  smoke-test:
    # Reuses the Linux publish artifact from build — no second restore/build.
    # Waits for coverage so broken unit/integration shards cannot green-path smoke.
    runs-on: ubuntu-latest
    needs: [changes, build, coverage]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v5
        with:
          name: web-publish-${{ github.run_id }}
          path: smoke-app

      - name: Start app in background
        run: |
          # Content root must be the publish folder so appsettings*.json (including
          # Admin:AllowedEmails in appsettings.Testing.json) are loaded. Without this,
          # cwd is the job workspace root and ValidateOnStart fails with empty admin options.
          chmod +x ./smoke-app/QueenZone.Web
          APP_DIR="$(pwd)/smoke-app"
          ASPNETCORE_ENVIRONMENT=Testing \
          ASPNETCORE_URLS=http://127.0.0.1:5099 \
          ASPNETCORE_CONTENTROOT="$APP_DIR" \
          "$APP_DIR/QueenZone.Web" > smoke-app.log 2>&1 &
          echo $! > smoke-app.pid

      - name: Wait for app to be ready
        run: |
          echo "Waiting for web app..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5099/health > /dev/null; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start in time"
          cat smoke-app.log || true
          exit 1

      - name: Smoke checks for key routes
        run: |
          curl -sf http://127.0.0.1:5099/health | grep -q '"status":"ok"' || { echo "Health endpoint failed"; exit 1; }
          curl -sf http://127.0.0.1:5099/ | grep -q "Latest news" || { echo "Homepage content missing"; exit 1; }
          curl -sf http://127.0.0.1:5099/news | grep -q "News archive" || { echo "News archive content missing"; exit 1; }

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-app-log-${{ github.run_id }}
          path: smoke-app.log
          retention-days: 7

  e2e-test:
    # Runs on whichever self-hosted runner with the `e2e` label is online and
    # idle (currently a Windows box and a Mac — see repo Settings > Actions >
    # Runners), instead of a GitHub-hosted runner, so it does not consume
    # billed Actions minutes. GitHub queues to whichever matching runner
    # picks the job up first; there's no guaranteed preference between them,
    # so steps below branch on `runner.os` to cover both. Both runners need
    # the .NET 10 SDK on PATH already (see "Verify .NET SDK" below); the
    # macOS runner additionally needs PowerShell 7 (`pwsh`, e.g. via
    # `brew install --cask powershell`) for the Playwright install step,
    # since that step runs Playwright's generated .ps1 installer script.
    #
    # This is a merge gate enforced by main's required status checks, not a
    # deploy gate — deploy.yml does not re-run e2e, so a deploy is never
    # blocked by both runners being offline. Untested code still can't reach
    # main because the PR itself can't merge without a green run here.
    runs-on: [self-hosted, e2e]
    needs: [changes, build, coverage]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15

    steps:
      # If a previous run's "Stop app" step failed to terminate the real
      # QueenZone.Web(.exe) child process (see that step's comment below), it
      # is left running and (on Windows) holding its own exe file locked,
      # which makes actions/checkout's workspace clean fail with an EPERM
      # unlink error before any of our own steps even run. Clear out any
      # leftover process from a prior run first so checkout can clean the
      # workspace.
      - name: Kill stray app processes from a previous run (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-Process -Name "QueenZone.Web" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Kill stray app processes from a previous run (macOS)
        if: runner.os == 'macOS'
        run: pkill -f QueenZone.Web || true

      - name: Checkout
        uses: actions/checkout@v6

      # actions/setup-dotnet tries to (re)install into a system path the
      # runner service account cannot write to without elevation. Both
      # machines already have the .NET 10 SDK installed and on PATH, so use
      # that directly instead of running the action here.
      - name: Verify .NET SDK
        run: dotnet --version

      # E2E does not ProjectReference Web — restore each graph separately and
      # skip the solution's unit/integration test projects. Linux publish from
      # the `build` job is not reusable here (need a native QueenZone.Web
      # executable for these OSes).
      - name: Restore E2E tests and web app
        run: |
          dotnet restore tests/QueenZone.Web.E2E/QueenZone.Web.E2E.csproj
          dotnet restore src/QueenZone.Web/QueenZone.Web.csproj

      - name: Build E2E tests
        run: dotnet build tests/QueenZone.Web.E2E/QueenZone.Web.E2E.csproj --configuration Release --no-restore

      - name: Install Playwright browsers (Windows)
        if: runner.os == 'Windows'
        run: .\tests\QueenZone.Web.E2E\bin\Release\net10.0\playwright.ps1 install chromium

      # Uses the same generated .ps1 installer as Windows (it matches the
      # exact Playwright package/browser version used by the built test
      # project — a separately-versioned CLI tool could drift out of sync),
      # invoked via pwsh since macOS's default shell is bash.
      - name: Install Playwright browsers (macOS)
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./tests/QueenZone.Web.E2E/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Publish web app
        run: dotnet publish src/QueenZone.Web/QueenZone.Web.csproj --configuration Release --no-restore --output e2e-app

      - name: Make published app executable (macOS)
        if: runner.os == 'macOS'
        run: chmod +x e2e-app/QueenZone.Web

      - name: Start app in background (Windows)
        if: runner.os == 'Windows'
        run: |
          # Start-Process makes the app a child of this step's process, which is
          # tied to the runner's Windows Job Object and gets killed when this step
          # exits. Launch via WMI instead so it survives into later steps.
          $appDir = (Resolve-Path ".\e2e-app").Path
          $exePath = Join-Path $appDir "QueenZone.Web.exe"
          $logPath = Join-Path (Get-Location).Path "e2e-app.log"
          $errPath = Join-Path (Get-Location).Path "e2e-app.err.log"
          $cmdLine = "cmd.exe /c `"set ASPNETCORE_ENVIRONMENT=Testing&&set ASPNETCORE_URLS=http://127.0.0.1:5099&&set ASPNETCORE_CONTENTROOT=$appDir&&`"$exePath`" > `"$logPath`" 2> `"$errPath`"`""
          $result = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $cmdLine; CurrentDirectory = $appDir }
          if ($result.ReturnValue -ne 0) {
            throw "Failed to start app via WMI, return code $($result.ReturnValue)"
          }
          $cmdPid = $result.ProcessId
          $cmdPid | Out-File -Encoding ascii e2e-app-cmd.pid

          # $cmdPid is cmd.exe's PID, not QueenZone.Web.exe's. Find the real child
          # so "Stop app" can target the actual listener.
          $appPid = $cmdPid
          for ($i = 1; $i -le 10; $i++) {
            $child = Get-CimInstance Win32_Process -Filter "ParentProcessId=$cmdPid" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($child) {
              $appPid = $child.ProcessId
              break
            }
            Start-Sleep -Milliseconds 500
          }
          $appPid | Out-File -Encoding ascii e2e-app.pid
          Write-Host "Started app: cmd.exe PID $cmdPid, QueenZone.Web.exe PID $appPid"

      - name: Start app in background (macOS)
        if: runner.os == 'macOS'
        run: |
          # Unlike Windows, a POSIX background process (`&`) survives past the
          # end of this step without needing a WMI-style detach trick — it's
          # simply re-parented, not tied to the step's own process tree.
          APP_DIR="$(pwd)/e2e-app"
          ASPNETCORE_ENVIRONMENT=Testing \
          ASPNETCORE_URLS=http://127.0.0.1:5099 \
          ASPNETCORE_CONTENTROOT="$APP_DIR" \
          "$APP_DIR/QueenZone.Web" > e2e-app.log 2> e2e-app.err.log &
          echo $! > e2e-app.pid

      - name: Wait for app to be ready (Windows)
        if: runner.os == 'Windows'
        run: |
          Write-Host "Waiting for web app..."
          $appPid = Get-Content e2e-app.pid
          for ($i = 1; $i -le 60; $i++) {
            $proc = Get-Process -Id $appPid -ErrorAction SilentlyContinue
            if (-not $proc) {
              Write-Host "App process (PID $appPid) exited unexpectedly after $($i * 2)s"
              break
            }
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:5099/health" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host "App is up after $($i * 2)s"
                exit 0
              }
            } catch {
              Write-Host "Attempt ${i}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2
          }
          Write-Host "App failed to start in time. Process running: $([bool](Get-Process -Id $appPid -ErrorAction SilentlyContinue))"
          Get-Content e2e-app.log -ErrorAction SilentlyContinue
          Get-Content e2e-app.err.log -ErrorAction SilentlyContinue
          exit 1

      - name: Wait for app to be ready (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Waiting for web app..."
          for i in $(seq 1 60); do
            if ! kill -0 "$(cat e2e-app.pid)" 2>/dev/null; then
              echo "App process exited unexpectedly after ${i}s"
              break
            fi
            if curl -sf http://127.0.0.1:5099/health > /dev/null; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start in time"
          cat e2e-app.log e2e-app.err.log 2>/dev/null || true
          exit 1

      - name: Run Playwright e2e tests
        env:
          E2E_BASE_URL: http://127.0.0.1:5099
          E2E_ADMIN_EMAIL: admin@test.local
          E2E_ARTIFACT_DIR: test-results/e2e
        run: dotnet test tests/QueenZone.Web.E2E/QueenZone.Web.E2E.csproj --configuration Release --no-build

      - name: Stop app (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          if (Test-Path e2e-app.pid) {
            Stop-Process -Id (Get-Content e2e-app.pid) -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path e2e-app-cmd.pid) {
            Stop-Process -Id (Get-Content e2e-app-cmd.pid) -Force -ErrorAction SilentlyContinue
          }

          # Belt-and-suspenders: "Start app in background" can fall back to
          # cmd.exe's PID if its child-process lookup doesn't find the real
          # QueenZone.Web.exe PID in time, which orphans it. An orphaned
          # QueenZone.Web.exe keeps its own exe file locked, which makes the
          # *next* run's checkout fail before any of that run's steps even
          # execute. Kill by image name too, and confirm it actually exited
          # (Stop-Process returning doesn't guarantee the OS has released the
          # file handle yet) before finishing this step.
          Get-Process -Name "QueenZone.Web" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          for ($i = 1; $i -le 15; $i++) {
            if (-not (Get-Process -Name "QueenZone.Web" -ErrorAction SilentlyContinue)) {
              Write-Host "QueenZone.Web.exe confirmed stopped"
              break
            }
            Start-Sleep -Milliseconds 500
          }

      - name: Stop app (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          if [ -f e2e-app.pid ]; then
            kill "$(cat e2e-app.pid)" 2>/dev/null || true
          fi
          pkill -f QueenZone.Web 2>/dev/null || true

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-playwright-${{ github.run_id }}
          path: |
            test-results/e2e/
            e2e-app.log
            e2e-app.err.log
          if-no-files-found: ignore
          retention-days: 7
