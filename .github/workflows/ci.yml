name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-flight run on main — that's the deploy pipeline, and
  # cancelling it mid-migrate/deploy can leave the DB or App Service half-updated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
      migrations: ${{ steps.check.outputs.migrations }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for code changes
        id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> $GITHUB_OUTPUT
            echo "migrations=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only origin/main...HEAD | grep -qvE '^(docs/|[^/]*\.md$)'; then
            echo "code=true" >> $GITHUB_OUTPUT
          else
            echo "code=false" >> $GITHUB_OUTPUT
            echo "Docs-only PR — skipping build and test jobs."
          fi

          if git diff --name-only origin/main...HEAD | grep -qE \
            '^(src/QueenZone\.Data/Migrations/|src/QueenZone\.Data/QueenZoneDbContext\.cs|src/QueenZone\.Data/QueenZoneDbContextFactory\.cs|src/QueenZone\.Data/Entities/)'; then
            echo "migrations=true" >> $GITHUB_OUTPUT
            echo "EF migration-related paths changed — will run Azure SQL migration gate."
          else
            echo "migrations=false" >> $GITHUB_OUTPUT
          fi

  # Builds and publishes the Linux app once per commit ("build once, deploy many").
  # Deterministic tests run in the `test` matrix (mixed Web.Tests shards — see
  # docs/architecture/testing-policy.md). smoke-test / deploy reuse the publish
  # artifact. e2e-test still builds on Windows but skips the solution unit graph.
  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore QueenZone.sln

      - name: Build
        run: dotnet build QueenZone.sln --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format QueenZone.sln --verify-no-changes --no-restore

      # Sharded test jobs download these binaries and run `dotnet test --no-build`
      # so we do not pay a second full compile on each matrix leg.
      - name: Upload build binaries
        uses: actions/upload-artifact@v5
        with:
          name: build-binaries-${{ github.run_id }}
          path: |
            src/**/bin/Release/
            tests/**/bin/Release/
          retention-days: 1
          if-no-files-found: error

      # Single Linux publish reused by smoke-test (PR) and deploy (main).
      - name: Publish web app
        run: dotnet publish src/QueenZone.Web/QueenZone.Web.csproj --configuration Release --no-build --output publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-publish-${{ github.run_id }}
          path: publish
          retention-days: 7

  # Mixed Web.Tests shards (unit + WAF in every shard). Do not change this to a
  # unit-vs-integration split — that regresses wall-clock (issue #442).
  test:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Download build binaries
        uses: actions/download-artifact@v5
        with:
          name: build-binaries-${{ github.run_id }}
          path: .

      - name: Restore (NuGet cache for test host deps)
        run: dotnet restore QueenZone.sln

      - name: Show shard assignment
        shell: pwsh
        run: ./scripts/Get-WebTestShardFilter.ps1 -ShardIndex ${{ matrix.shard }} -ShardCount 2 -List

      - name: Test shard ${{ matrix.shard }} with coverage
        shell: pwsh
        run: |
          $includeSmall = $${{ matrix.shard == 0 }}
          ./scripts/Invoke-WebTestsShard.ps1 `
            -ShardIndex ${{ matrix.shard }} `
            -ShardCount 2 `
            -CollectCoverage `
            -IncludeSmallProjects:$includeSmall `
            -ResultsDirectory ./TestResults `
            -NoBuild `
            -NoRestore

      - name: Upload coverage results
        uses: actions/upload-artifact@v5
        with:
          name: coverage-raw-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: TestResults
          retention-days: 2
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage results
        uses: actions/download-artifact@v5
        with:
          pattern: coverage-raw-${{ github.run_id }}-shard-*
          path: TestResults
          merge-multiple: true

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub

      - name: Add coverage summary
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Enforce coverage gate
        shell: pwsh
        run: ./scripts/Test-CoverageGate.ps1 -Reports ./TestResults -GlobalLineThreshold 51 -ChangedLineThreshold 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage-report
          retention-days: 14

  ef-migrations:
    name: EF migrations (Azure SQL)
    runs-on: ubuntu-latest
    needs: changes
    # Same-repo PRs only: applies pending migrations to the shared Azure SQL used by deploy.
    # Skipped on push-to-main (the migrate job below already runs database update) and on
    # fork PRs (no secret).
    if: |
      needs.changes.outputs.migrations == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: dev
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore tools and solution
        run: |
          dotnet tool restore
          dotnet restore QueenZone.sln

      - name: Check EF model snapshot is current
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/QueenZone.Data/QueenZone.Data.csproj \
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Apply migrations to Azure SQL
        env:
          ConnectionStrings__QueenZoneLegacy: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: |
          if [ -z "$ConnectionStrings__QueenZoneLegacy" ]; then
            echo "::error::QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping before merging EF migration PRs."
            exit 1
          fi

          echo "Applying EF migrations against Azure SQL (same target as App Service deploy)."
          echo "This catches SQL Server batch-binding errors, bad procs, and long-running DDL before merge."
          dotnet ef database update \
            --project src/QueenZone.Data/QueenZone.Data.csproj \
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

  smoke-test:
    # Reuses the Linux publish artifact from build — no second restore/build.
    # Waits for coverage so broken unit/integration shards cannot green-path smoke.
    runs-on: ubuntu-latest
    needs: [changes, build, coverage]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 5

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v5
        with:
          name: web-publish-${{ github.run_id }}
          path: smoke-app

      - name: Start app in background
        run: |
          # Content root must be the publish folder so appsettings*.json (including
          # Admin:AllowedEmails in appsettings.Testing.json) are loaded. Without this,
          # cwd is the job workspace root and ValidateOnStart fails with empty admin options.
          chmod +x ./smoke-app/QueenZone.Web
          APP_DIR="$(pwd)/smoke-app"
          ASPNETCORE_ENVIRONMENT=Testing \
          ASPNETCORE_URLS=http://127.0.0.1:5099 \
          ASPNETCORE_CONTENTROOT="$APP_DIR" \
          "$APP_DIR/QueenZone.Web" > smoke-app.log 2>&1 &
          echo $! > smoke-app.pid

      - name: Wait for app to be ready
        run: |
          echo "Waiting for web app..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5099/health > /dev/null; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start in time"
          cat smoke-app.log || true
          exit 1

      - name: Smoke checks for key routes
        run: |
          curl -sf http://127.0.0.1:5099/health | grep -q '"status":"ok"' || { echo "Health endpoint failed"; exit 1; }
          curl -sf http://127.0.0.1:5099/ | grep -q "Latest news" || { echo "Homepage content missing"; exit 1; }
          curl -sf http://127.0.0.1:5099/news | grep -q "News archive" || { echo "News archive content missing"; exit 1; }

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-app-log-${{ github.run_id }}
          path: smoke-app.log
          retention-days: 7

  e2e-test:
    # Runs on a self-hosted Windows runner (this machine) instead of a
    # GitHub-hosted runner, so it does not consume billed Actions minutes.
    #
    # This job gates deploy (see migrate/deploy below) — it must pass before
    # any build ships. That also means a deploy cannot happen while this
    # runner is offline; that's intentional (tests must pass before deploy),
    # not an oversight.
    runs-on: [self-hosted, Windows]
    needs: [changes, build, coverage]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15

    steps:
      # If a previous run's "Stop app" step failed to terminate the real
      # QueenZone.Web.exe child process (see that step's comment below), it
      # is left running and holding its own exe file locked, which makes
      # actions/checkout's workspace clean fail with an EPERM unlink error
      # before any of our own steps even run. Clear out any leftover process
      # from a prior run first so checkout can clean the workspace.
      - name: Kill stray app processes from a previous run
        run: |
          Get-Process -Name "QueenZone.Web" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Checkout
        uses: actions/checkout@v6

      # actions/setup-dotnet tries to (re)install into C:\Program Files\dotnet,
      # which the runner service account cannot write to without elevation.
      # This machine already has the .NET 10 SDK installed and on PATH, so
      # use that directly instead of running the action here.
      - name: Verify .NET SDK
        run: dotnet --version

      # E2E does not ProjectReference Web — restore each graph separately and
      # skip the solution's unit/integration test projects. Linux publish from
      # the build job is not reusable here (need QueenZone.Web.exe on Windows).
      - name: Restore E2E tests and web app
        run: |
          dotnet restore tests/QueenZone.Web.E2E/QueenZone.Web.E2E.csproj
          dotnet restore src/QueenZone.Web/QueenZone.Web.csproj

      - name: Build E2E tests
        run: dotnet build tests/QueenZone.Web.E2E/QueenZone.Web.E2E.csproj --configuration Release --no-restore

      - name: Install Playwright browsers
        run: .\tests\QueenZone.Web.E2E\bin\Release\net10.0\playwright.ps1 install chromium

      - name: Publish web app (Windows)
        run: dotnet publish src/QueenZone.Web/QueenZone.Web.csproj --configuration Release --no-restore --output e2e-app

      - name: Start app in background
        run: |
          # Start-Process makes the app a child of this step's process, which is
          # tied to the runner's Windows Job Object and gets killed when this step
          # exits. Launch via WMI instead so it survives into later steps.
          $appDir = (Resolve-Path ".\e2e-app").Path
          $exePath = Join-Path $appDir "QueenZone.Web.exe"
          $logPath = Join-Path (Get-Location).Path "e2e-app.log"
          $errPath = Join-Path (Get-Location).Path "e2e-app.err.log"
          $cmdLine = "cmd.exe /c `"set ASPNETCORE_ENVIRONMENT=Testing&&set ASPNETCORE_URLS=http://127.0.0.1:5099&&set ASPNETCORE_CONTENTROOT=$appDir&&`"$exePath`" > `"$logPath`" 2> `"$errPath`"`""
          $result = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $cmdLine; CurrentDirectory = $appDir }
          if ($result.ReturnValue -ne 0) {
            throw "Failed to start app via WMI, return code $($result.ReturnValue)"
          }
          $cmdPid = $result.ProcessId
          $cmdPid | Out-File -Encoding ascii e2e-app-cmd.pid

          # $cmdPid is cmd.exe's PID, not QueenZone.Web.exe's. Find the real child
          # so "Stop app" can target the actual listener.
          $appPid = $cmdPid
          for ($i = 1; $i -le 10; $i++) {
            $child = Get-CimInstance Win32_Process -Filter "ParentProcessId=$cmdPid" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($child) {
              $appPid = $child.ProcessId
              break
            }
            Start-Sleep -Milliseconds 500
          }
          $appPid | Out-File -Encoding ascii e2e-app.pid
          Write-Host "Started app: cmd.exe PID $cmdPid, QueenZone.Web.exe PID $appPid"

      - name: Wait for app to be ready
        run: |
          Write-Host "Waiting for web app..."
          $appPid = Get-Content e2e-app.pid
          for ($i = 1; $i -le 60; $i++) {
            $proc = Get-Process -Id $appPid -ErrorAction SilentlyContinue
            if (-not $proc) {
              Write-Host "App process (PID $appPid) exited unexpectedly after $($i * 2)s"
              break
            }
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:5099/health" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host "App is up after $($i * 2)s"
                exit 0
              }
            } catch {
              Write-Host "Attempt ${i}: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2
          }
          Write-Host "App failed to start in time. Process running: $([bool](Get-Process -Id $appPid -ErrorAction SilentlyContinue))"
          Get-Content e2e-app.log -ErrorAction SilentlyContinue
          Get-Content e2e-app.err.log -ErrorAction SilentlyContinue
          exit 1

      - name: Run Playwright e2e tests
        env:
          E2E_BASE_URL: http://127.0.0.1:5099
          E2E_ADMIN_EMAIL: admin@test.local
          E2E_ARTIFACT_DIR: test-results/e2e
        run: dotnet test tests/QueenZone.Web.E2E/QueenZone.Web.E2E.csproj --configuration Release --no-build

      - name: Stop app
        if: always()
        run: |
          if (Test-Path e2e-app.pid) {
            Stop-Process -Id (Get-Content e2e-app.pid) -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path e2e-app-cmd.pid) {
            Stop-Process -Id (Get-Content e2e-app-cmd.pid) -Force -ErrorAction SilentlyContinue
          }

          # Belt-and-suspenders: "Start app in background" can fall back to
          # cmd.exe's PID if its child-process lookup doesn't find the real
          # QueenZone.Web.exe PID in time, which orphans it. An orphaned
          # QueenZone.Web.exe keeps its own exe file locked, which makes the
          # *next* run's checkout fail before any of that run's steps even
          # execute. Kill by image name too, and confirm it actually exited
          # (Stop-Process returning doesn't guarantee the OS has released the
          # file handle yet) before finishing this step.
          Get-Process -Name "QueenZone.Web" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          for ($i = 1; $i -le 15; $i++) {
            if (-not (Get-Process -Name "QueenZone.Web" -ErrorAction SilentlyContinue)) {
              Write-Host "QueenZone.Web.exe confirmed stopped"
              break
            }
            Start-Sleep -Milliseconds 500
          }

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-playwright-${{ github.run_id }}
          path: |
            test-results/e2e/
            e2e-app.log
            e2e-app.err.log
          if-no-files-found: ignore
          retention-days: 7

  # --- Deploy chain: push to main only. Gated on build, smoke-test, and
  # e2e-test all passing, so nothing ships without a green build once + full
  # test pass. ---

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [changes, build, smoke-test, e2e-test]
    if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore QueenZone.sln

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Apply database migrations
        env:
          ConnectionStrings__QueenZoneLegacy: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: |
          if [ -z "$ConnectionStrings__QueenZoneLegacy" ]; then
            echo "::error::QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping before deploying."
            exit 1
          fi

          dotnet ef database update \
            --project src/QueenZone.Data/QueenZone.Data.csproj \
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, build, migrate]
    if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: dev
      url: https://www.queenzone.org

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v5
        with:
          name: web-publish-${{ github.run_id }}
          path: publish

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: queenzone-dev
          publish-profile: ${{ steps.bitwarden-secrets.outputs.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

  post-deploy-smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: [changes, deploy]
    if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Allow retry loop (~8 min) plus request time; avoid false fails during App Service recycle.
    timeout-minutes: 12

    steps:
      # Smoke the public custom domain (Site:PublicBaseUrl), not only the App Service hostname.
      # /health alone is liveness only — content pages can still 500 during recycle/warmup.
      # Retry the full suite until every path returns 200 (or timeout). A failed smoke fails
      # this job so GitHub Actions can email watchers.
      - name: Post-deploy smoke (custom domain)
        run: |
          BASE_URL="https://www.queenzone.org"
          WARMUP_PATH="/warmup"
          PATHS=(
            "/health"
            "/"
            "/news"
            "/forum"
            # Representative modern-forum category/topic pages (guards accidental LegacyForumRepository fallback).
            "/forum/1/queen-serious-discussion"
            "/forum/topic/455095/forum-guidelines"
            "/articles"
            "/biography"
            "/photography"
            "/search"
          )
          MAX_ATTEMPTS=32
          SLEEP_SECONDS=15

          echo "Waiting for warmup on ${BASE_URL}${WARMUP_PATH} after deploy (up to ~$(( MAX_ATTEMPTS * SLEEP_SECONDS / 60 )) minutes)."
          echo "/health is not sufficient readiness — App Service can answer liveness while pages still 500."

          check_path() {
            local path="$1"
            local url="${BASE_URL}${path}"
            local status body_file
            body_file="$(mktemp)"
            # Prefer any HTTP code curl wrote; only use 000 when stdout is empty (avoids "500000").
            status=$(curl -s -o "$body_file" -w "%{http_code}" --max-time 30 -L "$url") || status="${status:-000}"
            if [ "$status" != "200" ]; then
              echo "  ✗ $path → HTTP $status"
              rm -f "$body_file"
              return 1
            fi
            if [ "$path" = "/health" ]; then
              if ! grep -q '"status":"ok"' "$body_file"; then
                echo "  ✗ $path → 200 but body missing \"status\":\"ok\""
                rm -f "$body_file"
                return 1
              fi
            fi
            echo "  ✓ $path → HTTP $status"
            rm -f "$body_file"
            return 0
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Warmup attempt ${attempt}/${MAX_ATTEMPTS}..."
            if check_path "$WARMUP_PATH"; then
              echo "Warmup passed on attempt ${attempt}."
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Warmup failed against ${BASE_URL}${WARMUP_PATH} after ${MAX_ATTEMPTS} attempts. Check App Service logs."
              exit 1
            fi

            echo "Warmup not ready yet. Retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

          echo "Polling content routes on $BASE_URL after warmup."
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}..."
            failed=0
            for path in "${PATHS[@]}"; do
              if ! check_path "$path"; then
                failed=1
              fi
            done

            if [ "$failed" -eq 0 ]; then
              echo "All post-deploy smoke checks passed on attempt ${attempt}."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Site not ready (App Service recycle/warmup). Retrying in ${SLEEP_SECONDS}s..."
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "::error::Post-deploy smoke failed against $BASE_URL after ${MAX_ATTEMPTS} attempts. Check App Service logs."
          exit 1
