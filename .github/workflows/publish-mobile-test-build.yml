name: Publish mobile test build

on:
  push:
    branches:
      - main
    paths:
      - "src/QueenZone.Mobile/**"
      - ".github/workflows/publish-mobile-test-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mobile-test-build
  cancel-in-progress: false

jobs:
  preflight:
    name: Mobile preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Preflight
        run: npm run preflight

  publish-android:
    name: Build and publish Android APK
    needs: preflight
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deploy
    defaults:
      run:
        working-directory: src/QueenZone.Mobile
    env:
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/QueenZone.Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Generate Android project
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Confirm Sentry DSN is baked into Expo extra
        run: |
          set -euo pipefail
          dsn=$(npx expo config --json | jq -r '.extra.sentryDsn // .exp.extra.sentryDsn // empty')
          if [ -z "$dsn" ]; then
            echo "::error::app.config extra.sentryDsn is empty; published builds will not report to Sentry."
            exit 1
          fi
          echo "extra.sentryDsn is set (length ${#dsn})"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/QueenZone.Mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Fetch Android signing secrets from Bitwarden
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_MOBILE_BUILD_SECRETS }}

      - name: Restore stable test signing key
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_TEST_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_TEST_KEYSTORE_BASE64 is not configured in the deploy environment."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/queenzone-signing"
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/queenzone-signing/queenzone-test.jks"

      - name: Assemble signed standalone APK
        working-directory: src/QueenZone.Mobile/android
        env:
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_PASSWORD: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEY_PASSWORD }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ steps.bitwarden-secrets.outputs.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$ANDROID_TEST_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_TEST_KEY_PASSWORD" ]; then
            echo "::error::Android test signing passwords are not configured in the deploy environment."
            exit 1
          fi
          # Sentry upload runs during the Gradle assemble. Fail fast with a
          # clear message rather than a late sentry-cli org/auth error (#857).
          # EXPO_PUBLIC_SENTRY_DSN must also be present here so Metro inlines
          # it; extra.sentryDsn from prebuild is the other init path.
          missing=0
          for name in EXPO_PUBLIC_SENTRY_DSN SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN; do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set for the Android publish build (repo vars + Bitwarden SENTRY_AUTH_TOKEN)."
              missing=1
            else
              echo "$name is set (length ${#value})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          ./gradlew assembleRelease \
            -Pandroid.injected.version.code="${{ github.run_number }}" \
            -Pandroid.injected.version.name="0.1.0-test.${{ github.run_number }}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/queenzone-signing/queenzone-test.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_TEST_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=queenzone-test \
            -Pandroid.injected.signing.key.password="$ANDROID_TEST_KEY_PASSWORD"

      - name: Verify APK signature
        env:
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ steps.bitwarden-secrets.outputs.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify "$apk"
          expected=$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/queenzone-signing/queenzone-test.jks" \
            -storepass "$ANDROID_TEST_KEYSTORE_PASSWORD" \
            -alias queenzone-test | sha256sum | cut -d' ' -f1)
          actual=$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::The APK was not signed by the configured QueenZone test key."
            exit 1
          fi

      - name: Prepare download site
        shell: pwsh
        run: |
          $apk = Get-ChildItem android/app/build/outputs/apk/release/*.apk | Select-Object -First 1
          if (-not $apk) {
            throw "Release APK was not produced."
          }

          $site = Join-Path $env:GITHUB_WORKSPACE "mobile-download-site"
          New-Item -ItemType Directory -Path $site -Force | Out-Null
          Copy-Item distribution/index.html $site/index.html
          Copy-Item distribution/staticwebapp.config.json $site/staticwebapp.config.json

          $perth = [System.TimeZoneInfo]::FindSystemTimeZoneById("Australia/Perth")
          $builtAt = [System.TimeZoneInfo]::ConvertTime([DateTimeOffset]::UtcNow, $perth)
          $metadata = [ordered]@{
            builtAt = $builtAt.ToString("yyyy-MM-dd'T'HH:mm:sszzz")
            builtAtDisplay = $builtAt.ToString("d MMMM yyyy 'at' h:mm tt") + " AWST"
            commit = "${{ github.sha }}".Substring(0, 7)
            downloadUrl = "https://queenzonemobilebuilds.blob.core.windows.net/builds/queenzone-latest.apk"
            sizeBytes = $apk.Length
          }
          $metadata | ConvertTo-Json | Set-Content (Join-Path $site "build.json") -Encoding utf8NoBOM

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Read scoped Static Web App deployment token
        shell: bash
        run: |
          token=$(az staticwebapp secrets list \
            --name queenzone-dev \
            --resource-group Queenzone-RG \
            --query properties.apiKey \
            --output tsv)
          if [ -z "$token" ]; then
            echo "::error::Azure returned no Static Web App deployment token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Publish latest APK to dedicated Blob Storage
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name queenzonemobilebuilds \
            --container-name builds \
            --name queenzone-latest.apk \
            --file android/app/build/outputs/apk/release/app-release.apk \
            --overwrite true \
            --content-type application/vnd.android.package-archive \
            --content-disposition 'attachment; filename=queenzone-latest.apk' \
            --content-cache-control no-cache \
            --output none

      - name: Publish download site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: mobile-download-site
          output_location: ""
          skip_app_build: true

      - name: Verify public download page
        shell: bash
        working-directory: .
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://dev.queenzone.org/build.json \
              | jq -e --arg commit "${GITHUB_SHA:0:7}" '.commit == $commit' >/dev/null; then
              curl --fail --silent --show-error \
                https://queenzonemobilebuilds.blob.core.windows.net/builds/queenzone-latest.apk \
                --output /dev/null
              exit 0
            fi
            sleep 10
          done
          echo "::error::The new mobile build did not become available at https://dev.queenzone.org in time."
          exit 1
