name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel an in-flight run here — cancelling mid-migrate/deploy can
  # leave the DB or App Service half-updated.
  cancel-in-progress: false

# Runs after a PR merges to main. ci.yml already ran the full test/coverage/
# e2e suite against this exact tree as a required status check before the
# merge was allowed (see branch protection on main), so none of that re-runs
# here. This workflow no longer rebuilds — it reuses the exact binaries
# ci.yml already built and tested on the PR, resolved below by PR head SHA.
# Docs/infra/design/workflow-only merges skip migrate/deploy/post-deploy-smoke
# (see `changes`) since ci.yml never produced a binary to reuse for those.
# post-deploy-smoke is the safety net after the real deploy.
jobs:
  # Mirrors ci.yml's non-code bypass (scripts/classify-pipeline-changes.sh).
  # ci.yml skips `build` (no web-publish artifact) for those PRs, so deploy
  # has nothing to download — and there's genuinely nothing to redeploy.
  # Without this gate, resolve-ci-run still finds the successful-but-skipped
  # ci.yml run and `deploy` fails downloading an artifact that was never
  # uploaded.
  changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      code: ${{ steps.check.outputs.code }}
      migrations: ${{ steps.check.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for code changes
        id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ github.event.before }}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only ${{ github.event.before }}...${{ github.sha }} \
            | bash ./scripts/classify-pipeline-changes.sh \
            >> "$GITHUB_OUTPUT"

  # Finds the ci.yml run that built+tested this exact code, so `deploy` can
  # download its publish artifact instead of rebuilding. github.sha on main is
  # the merge result, not the PR head that ci.yml ran against:
  #   - merge commits (2 parents): second parent is the PR head
  #   - squash/rebase merges (1 parent): look up the associated PR head via API
  #   - direct pushes with no PR: fall back to github.sha itself
  resolve-ci-run:
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine PR head SHA
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PARENTS=($(git rev-list --parents -n 1 HEAD))
          if [ "${#PARENTS[@]}" -ge 3 ]; then
            HEAD_SHA="${PARENTS[2]}"
            echo "Merge commit — using second parent as PR head SHA."
          else
            # Squash/rebase merge: the commit on main is not the PR head that
            # ci.yml tested. Resolve via the commit→PR association.
            HEAD_SHA=$(gh api "repos/${{ github.repository }}/commits/${PARENTS[0]}/pulls" \
              --jq '.[0].head.sha // empty')
            if [ -n "$HEAD_SHA" ]; then
              echo "Single-parent commit — resolved associated PR head SHA."
            else
              HEAD_SHA="${PARENTS[0]}"
              echo "No associated PR — falling back to commit SHA itself."
            fi
          fi
          echo "Resolved PR head SHA: $HEAD_SHA"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Find matching CI run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
        run: |
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml \
            --json databaseId,headSha,conclusion,event \
            --jq "[.[] | select(.headSha == \"$HEAD_SHA\" and .conclusion == \"success\" and .event == \"pull_request\")][0].databaseId")

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful ci.yml run found for PR head SHA $HEAD_SHA. Cannot deploy without a tested build artifact."
            exit 1
          fi

          echo "Using ci.yml run $RUN_ID (artifact web-publish-$RUN_ID)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [changes]
    # Does not wait on resolve-ci-run — that output is only for the zip deploy.
    # Skip the restore/`database update` when the push did not touch EF paths
    # (issue #659). workflow_dispatch still fails closed (migrations=true).
    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.migrations == 'true'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore QueenZone.sln

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Apply database migrations
        env:
          ConnectionStrings__QueenZoneLegacy: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: |
          if [ -z "$ConnectionStrings__QueenZoneLegacy" ]; then
            echo "::error::QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping before deploying."
            exit 1
          fi

          dotnet ef database update \
            --project src/QueenZone.Data/QueenZone.Data.csproj \
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, resolve-ci-run, migrate]
    # migrate is skipped on non-EF pushes; treat skipped as success so the
    # zip deploy still runs (issue #659).
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.code == 'true' &&
      needs.resolve-ci-run.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    environment:
      name: dev
      url: https://www.queenzone.org

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reuses the exact binary ci.yml built and tested on the PR — no rebuild.
      - name: Download publish artifact from CI run
        uses: actions/download-artifact@v8
        with:
          name: web-publish-${{ needs.resolve-ci-run.outputs.run_id }}
          run-id: ${{ needs.resolve-ci-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: publish

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      # Enable run-from-package + platform warmup in the same job as the zip
      # push (issue #655). Do not flip WEBSITE_RUN_FROM_PACKAGE outside a
      # deploy — the current site is extracted files, not a package.
      - name: Ensure run-from-package and warmup settings
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ steps.bitwarden-secrets.outputs.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: python3 ./scripts/Set-AppServiceWebSettings.py

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: queenzone-dev
          publish-profile: ${{ steps.bitwarden-secrets.outputs.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Warm up custom domain
        run: bash ./scripts/Invoke-PostDeploySmoke.sh --warmup-only

  post-deploy-smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: [changes, deploy]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    # Allow retry loop (~8 min) plus request time; avoid false fails during App Service recycle.
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Smoke the public custom domain (Site:PublicBaseUrl), not only the App Service hostname.
      # /health alone is liveness only — content pages can still 500 during recycle/warmup.
      # The deploy job already polled /warmup; this job still starts with warmup
      # then the content-route suite. A failure fails the job so watchers get mail.
      - name: Post-deploy smoke (custom domain)
        run: bash ./scripts/Invoke-PostDeploySmoke.sh
