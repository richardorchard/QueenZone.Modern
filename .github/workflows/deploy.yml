name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel an in-flight run here — cancelling mid-migrate/deploy can
  # leave the DB or App Service half-updated.
  cancel-in-progress: false

# Runs after a PR merges to main. ci.yml already ran the full test/coverage/
# e2e suite against this exact tree as a required status check before the
# merge was allowed (see branch protection on main), so none of that re-runs
# here. This workflow no longer rebuilds — it reuses the exact binaries
# ci.yml already built and tested on the PR, resolved below by PR head SHA.
# Docs-only merges skip migrate/deploy/post-deploy-smoke entirely (see
# `changes`) since ci.yml never produced a binary to reuse for those.
# post-deploy-smoke is the safety net after the real deploy.
jobs:
  # Mirrors ci.yml's docs-only bypass. ci.yml skips `build` (no web-publish
  # artifact produced) for docs-only PRs, so deploy has nothing to download
  # for one of those commits — and there's genuinely nothing to redeploy
  # anyway, since no code changed. Without this gate, resolve-ci-run still
  # finds the (successful, but build-skipped) ci.yml run and `deploy` fails
  # trying to download an artifact that was never uploaded.
  changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for code changes
        id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ github.event.before }}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only ${{ github.event.before }}...${{ github.sha }} | grep -qvE '^(docs/|[^/]*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only push to main — nothing to deploy."
          fi

  # Finds the ci.yml run that built+tested this exact code, so `deploy` can
  # download its publish artifact instead of rebuilding. main is updated via
  # merge commits (see branch protection / PR merge method), so github.sha
  # here is the merge commit, not the PR head that ci.yml actually ran
  # against — walk to the merge commit's second parent to get that head SHA.
  # (A non-merge push, e.g. an admin push straight to main, has no second
  # parent; fall back to github.sha itself in that case.)
  resolve-ci-run:
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine PR head SHA
        id: sha
        run: |
          PARENTS=($(git rev-list --parents -n 1 HEAD))
          if [ "${#PARENTS[@]}" -ge 3 ]; then
            HEAD_SHA="${PARENTS[2]}"
          else
            HEAD_SHA="${PARENTS[0]}"
          fi
          echo "Resolved PR head SHA: $HEAD_SHA"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Find matching CI run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.sha.outputs.head_sha }}
        run: |
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml \
            --json databaseId,headSha,conclusion,event \
            --jq "[.[] | select(.headSha == \"$HEAD_SHA\" and .conclusion == \"success\" and .event == \"pull_request\")][0].databaseId")

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful ci.yml run found for PR head SHA $HEAD_SHA. Cannot deploy without a tested build artifact."
            exit 1
          fi

          echo "Using ci.yml run $RUN_ID (artifact web-publish-$RUN_ID)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [changes, resolve-ci-run]
    # main only, and only when this push actually changed code — resolve-ci-run
    # and changes are themselves gated the same way, so pushes to master or
    # docs-only pushes to main produce no jobs at all past `changes`.
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore QueenZone.sln

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Apply database migrations
        env:
          ConnectionStrings__QueenZoneLegacy: ${{ steps.bitwarden-secrets.outputs.QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING }}
        run: |
          if [ -z "$ConnectionStrings__QueenZoneLegacy" ]; then
            echo "::error::QUEENZONE_LEGACY_MIGRATION_CONNECTION_STRING is not configured. Check the Bitwarden secret and BITWARDEN_APP_SERVICE_DEPLOY_SECRETS mapping before deploying."
            exit 1
          fi

          dotnet ef database update \
            --project src/QueenZone.Data/QueenZone.Data.csproj \
            --startup-project src/QueenZone.Web/QueenZone.Web.csproj

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, resolve-ci-run, migrate]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    environment:
      name: dev
      url: https://www.queenzone.org

    steps:
      # Reuses the exact binary ci.yml built and tested on the PR — no rebuild.
      - name: Download publish artifact from CI run
        uses: actions/download-artifact@v8
        with:
          name: web-publish-${{ needs.resolve-ci-run.outputs.run_id }}
          run-id: ${{ needs.resolve-ci-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: publish

      - name: Fetch Bitwarden deploy secrets
        id: bitwarden-secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BITWARDEN_SECRETS_MANAGER_ACCESS_TOKEN }}
          secrets: ${{ vars.BITWARDEN_APP_SERVICE_DEPLOY_SECRETS }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: queenzone-dev
          publish-profile: ${{ steps.bitwarden-secrets.outputs.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

  post-deploy-smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: [changes, deploy]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    # Allow retry loop (~8 min) plus request time; avoid false fails during App Service recycle.
    timeout-minutes: 12

    steps:
      # Smoke the public custom domain (Site:PublicBaseUrl), not only the App Service hostname.
      # /health alone is liveness only — content pages can still 500 during recycle/warmup.
      # Retry the full suite until every path returns 200 (or timeout). A failed smoke fails
      # this job so GitHub Actions can email watchers.
      - name: Post-deploy smoke (custom domain)
        run: |
          BASE_URL="https://www.queenzone.org"
          WARMUP_PATH="/warmup"
          PATHS=(
            "/health"
            "/"
            "/news"
            "/forum"
            # Representative modern-forum category/topic pages (guards accidental LegacyForumRepository fallback).
            "/forum/1/queen-serious-discussion"
            "/forum/topic/455095/forum-guidelines"
            "/articles"
            "/biography"
            "/photography"
            "/search"
          )
          MAX_ATTEMPTS=32
          SLEEP_SECONDS=15

          echo "Waiting for warmup on ${BASE_URL}${WARMUP_PATH} after deploy (up to ~$(( MAX_ATTEMPTS * SLEEP_SECONDS / 60 )) minutes)."
          echo "/health is not sufficient readiness — App Service can answer liveness while pages still 500."

          check_path() {
            local path="$1"
            local url="${BASE_URL}${path}"
            local status body_file
            body_file="$(mktemp)"
            # Prefer any HTTP code curl wrote; only use 000 when stdout is empty (avoids "500000").
            status=$(curl -s -o "$body_file" -w "%{http_code}" --max-time 30 -L "$url") || status="${status:-000}"
            if [ "$status" != "200" ]; then
              echo "  ✗ $path → HTTP $status"
              rm -f "$body_file"
              return 1
            fi
            if [ "$path" = "/health" ]; then
              if ! grep -q '"status":"ok"' "$body_file"; then
                echo "  ✗ $path → 200 but body missing \"status\":\"ok\""
                rm -f "$body_file"
                return 1
              fi
            fi
            echo "  ✓ $path → HTTP $status"
            rm -f "$body_file"
            return 0
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Warmup attempt ${attempt}/${MAX_ATTEMPTS}..."
            if check_path "$WARMUP_PATH"; then
              echo "Warmup passed on attempt ${attempt}."
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Warmup failed against ${BASE_URL}${WARMUP_PATH} after ${MAX_ATTEMPTS} attempts. Check App Service logs."
              exit 1
            fi

            echo "Warmup not ready yet. Retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

          echo "Polling content routes on $BASE_URL after warmup."
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}..."
            failed=0
            for path in "${PATHS[@]}"; do
              if ! check_path "$path"; then
                failed=1
              fi
            done

            if [ "$failed" -eq 0 ]; then
              echo "All post-deploy smoke checks passed on attempt ${attempt}."
              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Site not ready (App Service recycle/warmup). Retrying in ${SLEEP_SECONDS}s..."
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "::error::Post-deploy smoke failed against $BASE_URL after ${MAX_ATTEMPTS} attempts. Check App Service logs."
          exit 1
